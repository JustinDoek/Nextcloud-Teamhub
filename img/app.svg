<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- TeamHub app icon (2026-09 brand sheet): the beeldmerk as a single-colour
       glyph — the team above the diagonal, the hub below it — with no tile,
       because Nextcloud draws the header icon on its own colour and inverts it
       on bright headers. All white, flat fills only; `app-dark.svg` is this
       file with #000.

       Reduced for 20 px: two silhouettes instead of img/logo.svg's three, a
       wider diagonal, one hub with three satellites. Three figures in one
       colour turn into a paw print at header size. -->
  <defs>
    <!-- Above-left of x + y = 59: a hairline short of the diagonal's near edge. -->
    <clipPath id="th-field"><path d="M0 0H59L0 59Z"/></clipPath>
  </defs>
  <g fill="#fff">
    <g clip-path="url(#th-field)">
      <circle cx="36" cy="10" r="5.5"/>
      <rect x="29" y="19" width="15" height="14" rx="7"/>
      <circle cx="20" cy="14" r="8"/>
      <rect x="8" y="25" width="24" height="24" rx="12"/>
    </g>
    <!-- The diagonal: a pill along x + y = 67.5, ends rounded. -->
    <rect x="-4.25" y="29.25" width="76" height="9" rx="4.5" transform="rotate(-45 33.75 33.75)"/>
    <!-- The hub. -->
    <g stroke="#fff" stroke-width="3" stroke-linecap="round">
      <line x1="47" y1="48" x2="35" y2="57"/>
      <line x1="47" y1="48" x2="57" y2="37"/>
      <line x1="47" y1="48" x2="58" y2="59"/>
    </g>
    <circle cx="35" cy="57" r="3.8"/>
    <circle cx="57" cy="37" r="3.8"/>
    <circle cx="58" cy="59" r="3.8"/>
    <circle cx="47" cy="48" r="6.5"/>
  </g>
</svg>
