<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- TeamHub app icon, black variant for the settings sections (Nextcloud
       inverts it in dark mode). Identical geometry to app.svg — keep the two
       in step; see that file for the reasoning. -->
  <defs>
    <!-- Above-left of x + y = 59: a hairline short of the diagonal's near edge. -->
    <clipPath id="th-field"><path d="M0 0H59L0 59Z"/></clipPath>
  </defs>
  <g fill="#000">
    <g clip-path="url(#th-field)">
      <circle cx="36" cy="10" r="5.5"/>
      <rect x="29" y="19" width="15" height="14" rx="7"/>
      <circle cx="20" cy="14" r="8"/>
      <rect x="8" y="25" width="24" height="24" rx="12"/>
    </g>
    <!-- The diagonal: a pill along x + y = 67.5, ends rounded. -->
    <rect x="-4.25" y="29.25" width="76" height="9" rx="4.5" transform="rotate(-45 33.75 33.75)"/>
    <!-- The hub. -->
    <g stroke="#000" stroke-width="3" stroke-linecap="round">
      <line x1="47" y1="48" x2="35" y2="57"/>
      <line x1="47" y1="48" x2="57" y2="37"/>
      <line x1="47" y1="48" x2="58" y2="59"/>
    </g>
    <circle cx="35" cy="57" r="3.8"/>
    <circle cx="57" cy="37" r="3.8"/>
    <circle cx="58" cy="59" r="3.8"/>
    <circle cx="47" cy="48" r="6.5"/>
  </g>
</svg>
