name: Publish to Nextcloud App Store

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Geeft de workflow toestemming om bestanden te uploaden naar de release
    permissions:
      contents: write

    # Every action is pinned to a full commit SHA (Semgrep
    # github-actions-mutable-action-tag, 2026-09-18): a tag or branch can be
    # repointed by the action's owner, a SHA cannot. The tag each SHA was
    # resolved from is kept as a comment; to update, resolve the new tag with
    #   curl -s https://api.github.com/repos/<owner>/<repo>/git/ref/tags/<tag>
    # and replace both the SHA and the comment.
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Only needed to run the verification gate below — nothing is compiled here.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      # NOTE: the frontend is deliberately NOT built here.
      #
      # js/ and css/ are compiled by the developer (`npm run build` in the
      # working repo) and mirrored into this repo by scripts/publish-to-release.js.
      # This workflow used to run `npm install && npm run build`, which compiled
      # whatever src/ was committed here -- for a long time a copy frozen on
      # 2026-07-20, so every release from v4.30 through v4.5.0 shipped a
      # v4.3.0-era frontend under a newer version number. Since v4.10.0 src/,
      # tests/ and vite.config.mjs ARE mirrored on every publish (REPO_ONLY in the
      # working repo's scripts/lib/app-files.js), so the repo carries the source
      # of the bundle it ships -- but the bundle is still not rebuilt here.
      # Packaging the committed bundle means the artifact customers install is
      # byte-for-byte the one that was tested locally.
      - name: Assemble app folder
        run: |
          set -euo pipefail
          mkdir teamhub
          # Keep this list in sync with PUBLISHABLE in the working repo's
          # scripts/publish-to-release.js.
          for entry in appinfo lib js css img l10n sql templates announcements \
                       composer.json package.json package-lock.json \
                       CHANGELOG.md README.md LICENSE; do
            if [ ! -e "$entry" ]; then
              echo "::error::Release payload is missing '$entry' -- run publish-to-release.js before tagging."
              exit 1
            fi
            cp -R "$entry" teamhub/
          done
          echo "Assembled:"
          ls -la teamhub/

      - name: Verify package against its integrity manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node .github/verify-package.js teamhub

      - name: Create tarball
        run: |
          set -euo pipefail
          tar -czf teamhub.tar.gz teamhub/
          ls -l teamhub.tar.gz

      - name: Upload Tarball to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: teamhub.tar.gz
          # Zorg dat we de exacte tag gebruiken
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Register in Nextcloud App Store
        uses: R0Wi/nextcloud-appstore-push-action@c30a75db8d7b01f70d80aaec65d731e0b00714c4 # v1.0.1
        with:
          app_name: teamhub
          app_private_key: ${{ secrets.NEXTCLOUD_KEY }}
          appstore_token: ${{ secrets.NEXTCLOUD_TOKEN }}
          download_url: https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/teamhub.tar.gz
